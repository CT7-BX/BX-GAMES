name: Publicar BX-GAMES no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js para testes
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar JavaScript e regressões
        run: |
          node --check catalog-v2_1.js
          node --check site.js
          node --check bx2-engine.js
          node --check bx2.js
          node --test tests/*.test.cjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
